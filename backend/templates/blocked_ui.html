<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked | Security Alert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050507; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-6">
    <div class="max-w-lg w-full glass-card p-10 rounded-3xl text-center shadow-2xl">
        <div class="text-6xl mb-6 text-red-500 animate-pulse">🛑</div>
        
        <h1 class="text-2xl font-bold text-white mb-4 italic">{{ url }} is blocked</h1>
        
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">
            This page has been blocked by your **DNS Anomaly Detection System**. 
            The domain shows patterns of malicious activity or phishing.
        </p>

        <div class="space-y-4">
            <button onclick="window.history.back()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20">
                GO BACK TO SAFETY
            </button>

            <div class="pt-4">
                <a href="{{ url }}" class="text-gray-500 hover:text-white text-xs underline decoration-gray-600 hover:decoration-white transition-all">
                    I trust this site, proceed anyway
                </a>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-white/5 text-[10px] text-gray-600 uppercase tracking-widest">
            Error Code: DNS_ANOMALY_DETECTED_BY_D.A.D
        </div>
    </div>
</body>
</html>
