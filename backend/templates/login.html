<!DOCTYPE html>
<html>
<head>
    <title>DNS Security Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .login-box {
            background:#1e293b;
            padding:40px;
            border-radius:10px;
            width:300px;
            text-align:center;
        }
        input {
            width:100%;
            padding:10px;
            margin:10px 0;
            border:none;
            border-radius:5px;
        }
        button {
            width:100%;
            padding:10px;
            background:#3b82f6;
            border:none;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover {
            background:#2563eb;
        }
        .error {
            color:#ff4d4d;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>DNS Security Login</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login">
            <input name="username" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
